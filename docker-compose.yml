services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reward
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rewardconnection}
      POSTGRES_DB: rewardconnection
    volumes:
      - rewardconnection_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward -d rewardconnection"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://reward:${POSTGRES_PASSWORD:-rewardconnection}@db:5432/rewardconnection?schema=public"
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://reward:${POSTGRES_PASSWORD:-rewardconnection}@db:5432/rewardconnection?schema=public"
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- \
            --header="Authorization: Bearer $${INTERNAL_CRON_SECRET}" \
            --post-data="" \
            http://app:3000/api/internal/reconcile >/dev/null 2>&1 || true
          sleep 30
        done

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-rewardconnection}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /backups
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          tmp="/backups/rewardconnection-$${stamp}.dump.tmp"
          out="/backups/rewardconnection-$${stamp}.dump"
          if pg_dump -h db -U reward -d rewardconnection -Fc > "$${tmp}"; then
            mv "$${tmp}" "$${out}"
            find /backups -type f -name 'rewardconnection-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          else
            rm -f "$${tmp}"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done

volumes:
  rewardconnection_pg:
