name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rewardconnection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rewardconnection_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rewardconnection_test?schema=public
      AUTH_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      APP_URL: http://localhost:3000
      AUTH_COOKIE_SECURE: "false"
      INTERNAL_CRON_SECRET: ci-only-internal-secret-with-more-than-twenty-four-characters
      MIKROTIK_ENABLED: "false"
      MIKROTIK_CHILD_SUBNET: 192.168.20.0/24
      TOKEN_MINUTES: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - name: Build production container
        run: docker build -t rewardconnection:ci .
